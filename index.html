.screen{display:none;position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.on{display:block}
#map{position:relative;inset:auto;min-height:100%;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#map.on{display:block}

.btn{font-weight:800;font-size:15px;line-height:1.2;border:2px solid var(--ink);background:var(--c,var(--butter));border-radius:16px;padding:7px 12px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);white-space:nowrap;min-width:40px}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.big{font-size:19px;padding:10px 20px;border-radius:20px}
.btn.off{opacity:.45;text-decoration:line-through}

/* sound toggles */
.toggles{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:90;display:flex;gap:6px}
.toggles .btn{padding:5px 7px;font-size:14px;box-shadow:1px 2px 0 var(--ink)}

/* ======== MAP ======== */
.hero{max-width:640px;margin:0 auto;padding:18px 18px 4px;text-align:center}
.hero .dn{width:96px;margin:6px auto 0}
.hero h1{margin:0;font-size:clamp(32px,9.5vw,46px);line-height:1;font-variation-settings:"INFM" 100,"BNCE" 60;font-weight:800}
.hero h1 .n{display:inline-block;position:relative;isolation:isolate}
.hero h1 .n::after{content:"";position:absolute;left:-4%;right:-4%;bottom:.08em;height:.32em;background:var(--mint);z-index:-1;border-radius:6px;transform:rotate(-1.5deg)}
.hero .for{font-family:var(--hand);font-size:24px;color:var(--pink2);margin:2px 0 0;font-weight:700}
.rank{display:inline-block;margin:10px auto 0;background:var(--pink);border-radius:18px;padding:5px 14px 7px;transform:rotate(-1.5deg);font-weight:800}
.rank small{display:block;font-family:var(--hand);font-weight:700;font-size:18px;color:var(--soft);line-height:1}
.stats{display:flex;justify-content:center;gap:14px;margin:12px 0 0;font-weight:800;font-size:18px;flex-wrap:wrap}
.menu{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px auto 0;max-width:520px;padding:0 10px}
.menu .btn{font-size:14px}

.worlds{max-width:640px;margin:0 auto;padding:0 12px}
.world{position:relative;margin:22px 0 0;border-radius:32px;padding:16px 14px 18px;background:var(--bg);overflow:hidden;border:2.5px solid rgba(58,46,107,.12)}
.world.dark{color:#fff}
.world h2{margin:0;text-align:center;font-size:24px;line-height:1.1;font-variation-settings:"INFM" 100,"BNCE" 45;font-weight:800}
.world h2 small{display:block;font-family:var(--hand);font-size:20px;font-weight:700;opacity:.8}
.world .deco{position:absolute;pointer-events:none;opacity:.9}
.path{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;margin-top:14px;z-index:2}
.node{position:relative;justify-self:center;width:78px;height:78px;border-radius:46% 54% 50% 50%/52% 48% 52% 48%;border:2.5px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.node:nth-child(2),.node:nth-child(5){transform:translateY(10px)}
.node .num{font-weight:800;font-size:20px;line-height:1;font-variation-settings:"INFM" 100,"BNCE" 50}
.node .ic{font-size:22px;line-height:1}
.node .st{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;letter-spacing:-1px;background:#fff;border-radius:10px;padding:0 4px;border:1.5px solid var(--ink)}
.node.done{background:var(--mint)}
.node.cur{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.node.boss{background:var(--pink)}
.node.boss.cur{background:var(--pink2)}
.node.locked{background:#eee;opacity:.6;cursor:default;box-shadow:1px 2px 0 var(--ink)}
.node .lbl{font-size:9.5px;font-weight:700;line-height:1.05;text-align:center;max-width:68px;margin-top:2px;overflow-wrap:anywhere;hyphens:auto}
.world.locked .path{filter:grayscale(.6);opacity:.7}
.world .lockmsg{text-align:center;font-family:var(--hand);font-size:22px;margin-top:14px;font-weight:700}

/* ======== HUNT ======== */
#hunt{background:var(--page);overflow:hidden}
.hud{position:relative;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 112px 8px 10px;background:rgba(255,253,247,.95);border-bottom:2.5px dashed var(--lilac2);min-height:58px}
.hud .x{padding:4px 9px}
.hud .goal{flex:1;min-width:0;line-height:1.15}
.hud .goal b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .goal span{font-family:var(--hand);font-size:18px;color:var(--soft);font-weight:700}
.hud .info{display:flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap}
.hud .lives{letter-spacing:-2px}
.field{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.item{position:absolute;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.item svg{width:100%;height:auto;display:block}
.item.sway svg{transform-origin:50% 100%;animation:sway var(--d,3s) ease-in-out infinite alternate}
.item.floaty svg{animation:bob var(--d,3s) ease-in-out infinite alternate}
.dino{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));cursor:pointer;padding:6px;margin:0;border:0;background:none;-webkit-appearance:none;appearance:none;transition:opacity .4s}
.dino svg{width:100%;height:auto;display:block;pointer-events:none;transform:scaleX(var(--fx,1))}
.dino.run{transition:left var(--t,1.8s) ease-in-out,top var(--t,1.8s) ease-in-out,opacity .4s}
.dino.under{opacity:.07;pointer-events:none}
.dino.ghost{opacity:.2}
.dino.memhide{opacity:0}
.dino.gold svg{filter:drop-shadow(0 0 6px #FFD34D)}
.dino .acc2{position:absolute;left:58%;top:48%;font-size:calc(var(--w,60px)*.24);line-height:1;pointer-events:none}
.dino.found{pointer-events:none;animation:caught .7s cubic-bezier(.3,1.6,.5,1) forwards;opacity:1!important}
.dino.bad{animation:shake .4s}
.dino.hint{z-index:35!important;opacity:1!important}
.dino.hint svg{animation:wiggle .35s ease-in-out 6 alternate}
.dino.hint::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed var(--pink2);animation:spin 3s linear infinite}
@keyframes wiggle{from{transform:rotate(-12deg) scale(1.1)}to{transform:rotate(12deg) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
.darkcv{position:absolute;inset:0;pointer-events:none;z-index:30}
.float{position:absolute;z-index:45;pointer-events:none;font-weight:800;font-variation-settings:"INFM" 100,"BNCE" 60;font-size:24px;color:var(--pink2);transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards;text-shadow:0 2px 0 #fff;white-space:nowrap}
.float.bad{color:#E05A7A}
.heart{position:absolute;z-index:44;pointer-events:none;width:16px;animation:burst .9s ease-out forwards}
.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;font-size:90px;font-weight:800;color:var(--ink);text-shadow:0 4px 0 #fff;font-variation-settings:"INFM" 100,"BNCE" 60}
.shakeit{animation:shake .4s}

/* ======== RUN ======== */
#run{background:#EAF0FF;overflow:hidden;touch-action:none}
#runCanvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pad{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:12px}
.pad.l{left:14px}.pad.r{right:14px}
.pad button{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--ink);background:rgba(255,255,255,.85);font-size:28px;font-weight:800;box-shadow:2px 3px 0 var(--ink);touch-action:none}
.pad button.on{background:var(--pink);transform:translate(2px,3px);box-shadow:0 0 0}
.pad.r button{width:84px;height:84px;background:rgba(255,194,217,.9)}
.runhud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 112px 8px 10px;font-weight:800}
.runhud .chip{background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:14px;padding:3px 10px;font-size:15px;white-space:nowrap}

/* ======== BOSS ======== */
#boss{background:#1E1838;color:#fff;overflow:hidden;touch-action:none}
.bwrap{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 14px 10px}
.btop{display:flex;align-items:center;gap:8px;padding-right:100px;min-height:44px}
.btop .x{padding:4px 9px;background:#fff;color:var(--ink)}
.bname{font-weight:800;font-size:16px;flex:1;min-width:0}
.bname.spare{color:#FFE59A}
.hpbar{height:12px;border:2px solid #fff;border-radius:10px;overflow:hidden;background:#3a3060;margin-top:3px}
.hpbar i{display:block;height:100%;background:var(--pink2);transition:width .4s}
.bossart{flex:0 0 auto;height:min(30vh,210px);display:grid;place-items:center;position:relative}
.bossart .art{width:min(62vw,230px);max-height:100%;animation:idle 2.4s ease-in-out infinite alternate}
.bossart .art svg{width:100%;height:auto;max-height:min(30vh,210px)}
.bossart .art.hit{animation:hitshake .45s}
.bossart .dmg{position:absolute;left:50%;top:30%;font-size:34px;font-weight:800;color:#FF6B8B;animation:rise 1s ease-out forwards;transform:translate(-50%,-50%);text-shadow:0 3px 0 #000}
.happy-face{display:none}.art.happy .happy-face{display:inline}.art.happy .angry-face{display:none}
.box{position:relative;flex:1 1 auto;min-height:150px;max-height:300px;border:4px solid #fff;margin:6px auto 0;width:100%;background:#000;overflow:hidden}
.box .txt{position:absolute;inset:0;padding:12px 14px;font-size:17px;line-height:1.4;white-space:pre-wrap}
.box .txt .nm{color:#FFE59A}
.box canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.box .tapnext{position:absolute;right:10px;bottom:6px;font-size:14px;opacity:.7;animation:blink 1s steps(2) infinite}
.box .opts{position:absolute;inset:0;padding:10px 12px;display:none;flex-direction:column;gap:6px;overflow:auto}
.box .opts button{text-align:left;background:none;border:0;color:#fff;font-size:17px;padding:6px 6px;border-radius:8px;cursor:pointer}
.box .opts button:active,.box .opts button:hover{background:#3a3060}
.box .opts button::before{content:"♡ ";color:var(--pink2)}
.bar{position:absolute;left:8%;right:8%;top:50%;height:46px;transform:translateY(-50%);border:3px solid #fff;display:none;background:repeating-linear-gradient(90deg,#222 0 10%,#333 10% 20%)}
.bar::before{content:"";position:absolute;left:45%;width:10%;top:0;bottom:0;background:rgba(255,148,188,.55)}
.bar i{position:absolute;top:-6px;bottom:-6px;width:6px;background:#fff;left:0;border-radius:3px}
.pstat{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-weight:800;font-size:15px}
.pstat .hpbar{flex:1;margin:0}
.pstat .hpbar i{background:#FFE59A}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts button{border:2.5px solid #FFAF7E;background:none;color:#FFAF7E;font-weight:800;font-size:12.5px;white-space:nowrap;padding:11px 0;border-radius:10px;cursor:pointer;letter-spacing:.02em}
.acts button:disabled{opacity:.35}
.acts button:not(:disabled):active{background:#FFAF7E;color:#1E1838}

/* ======== MINI GAMES ======== */
#mini{background:var(--page);overflow:hidden;touch-action:none}
.mstage{position:absolute;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg,#EEF0FF)}
.mrule{position:absolute;left:12px;right:12px;top:10px;background:rgba(255,255,255,.9);border:2px dashed var(--lilac2);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.35;text-align:center;z-index:3}
/* mail */
.mailcard{position:absolute;left:50%;top:46%;width:min(86vw,360px);transform:translate(-50%,-50%) rotate(var(--rot,0deg));background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 6px 0 var(--ink);padding:16px 16px 14px;touch-action:none;cursor:grab;transition:transform .25s,opacity .25s;z-index:4}
.mailcard.drag{transition:none}
.mailcard .from{font-size:13px;color:var(--soft);font-weight:700}
.mailcard .subj{font-size:20px;font-weight:800;line-height:1.2;margin:4px 0 6px;font-variation-settings:"INFM" 100,"BNCE" 30}
.mailcard .prev{font-size:14px;color:var(--soft)}
.mailcard .ava{float:right;width:58px;margin:-6px -4px 0 6px}
.mailcard .tbar{height:6px;background:#eee;border-radius:4px;margin-top:12px;overflow:hidden}
.mailcard .tbar i{display:block;height:100%;background:var(--pink2);width:100%}
.mailcard .stamp{position:absolute;top:18px;right:14px;font-weight:800;font-size:22px;padding:2px 10px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(12deg)}
.mailcard .stamp.imp{color:#3FA66B;border-color:#3FA66B}
.mailcard .stamp.ign{color:#E05A7A;border-color:#E05A7A;left:14px;right:auto;transform:rotate(-12deg)}
.mailbtns{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;z-index:5}
.mailbtns .btn{font-size:16px;padding:12px 16px}
.inboxn{position:absolute;left:50%;top:78%;transform:translateX(-50%);font-family:var(--hand);font-size:22px;color:var(--soft);white-space:nowrap}
/* whack */
.cubes{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(92vw,400px)}
.cube{position:relative;aspect-ratio:1/1.05;border-radius:16px;background:#fff;border:2.5px solid var(--ink);overflow:hidden;box-shadow:2px 3px 0 var(--ink)}
.cube::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:#DCD6F0;border-top:2.5px solid var(--ink);z-index:2}
.cube .pop{position:absolute;left:8%;right:8%;bottom:-80%;height:80%;transition:bottom .18s cubic-bezier(.3,1.5,.5,1);z-index:1;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.cube .pop.up{bottom:22%}
.cube .pop svg{width:100%;height:auto;max-height:100%}
.cube .pop .tsk{width:86%;aspect-ratio:1;background:var(--gold);border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:clamp(11px,3.3vw,15px);text-align:center;line-height:1.1;transform:rotate(-4deg);padding:4px}
.cube .pop .tsk.fire{background:#FFAF7E}
.cube .pop .tsk.cof{background:#fff;font-size:34px}
.cube .pop.hit{animation:caught .5s forwards}
/* coffee */
.cofwrap{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 10px 10px}
.order{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;max-width:340px;text-align:center;box-shadow:3px 4px 0 var(--ink);position:relative}
.order b{font-size:19px;display:block}
.order small{font-family:var(--hand);font-size:19px;color:var(--soft)}
.order .who{width:60px;position:absolute;left:-46px;top:-10px}
.cup{position:relative;width:150px;height:190px;border:4px solid var(--ink);border-top:0;border-radius:0 0 34px 34px;background:#fff;overflow:hidden}
.cup .liq{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#C08A62,#8F5E3E)}
.cup .foam{position:absolute;left:0;right:0;height:10px;background:#FFF3E6;bottom:0}
.cup .tgt{position:absolute;left:-6px;right:-6px;height:0;border-top:3px dashed #FF4F8B;z-index:2}
.cup .tgt span{position:absolute;right:-56px;top:-12px;font-weight:800;color:#FF4F8B;font-size:14px}
.handle{position:absolute;width:40px;height:70px;border:4px solid var(--ink);border-left:0;border-radius:0 30px 30px 0;margin-left:150px;margin-top:40px}
.cupbox{position:relative}
.holdbtn{width:150px;height:72px;border-radius:24px;font-size:20px}
.holdbtn.on{background:var(--pink2)!important;transform:translate(2px,3px);box-shadow:none}
.verdict{font-family:var(--hand);font-size:26px;font-weight:700;min-height:32px}
/* dice */
#mini.grim .mstage{background:radial-gradient(circle at 50% 30%,#3A3060,#140F26 75%)}
#mini.grim .hud{background:rgba(20,15,38,.95);color:#F5E6C0;border-bottom-color:#B8962E}
#mini.grim .hud .goal span{color:#C9B37A}
.dwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));gap:8px;color:#F5E6C0}
.squad{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:60px}
.unit{width:52px;position:relative;transition:opacity .4s,transform .4s}
.unit svg{width:100%;height:auto}
.unit.dead{opacity:.15;transform:rotate(90deg) scale(.8)}
.unit .hp{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;background:#B8962E;color:#140F26;border-radius:8px;padding:0 5px}
.unit.big{width:120px}
.sqlabel{text-align:center;font-weight:800;font-size:13px;letter-spacing:.06em;color:#C9B37A;text-transform:uppercase}
.tray{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;min-height:80px;border:2px solid #B8962E;border-radius:14px;background:rgba(0,0,0,.25);padding:8px}
.die{width:40px;height:40px;border-radius:9px;background:#F5E6C0;color:#140F26;display:grid;place-items:center;font-weight:800;font-size:22px;animation:roll .4s}
.die.ok{background:#7FD3A2}.die.no{background:#6B5B9A;color:#C9C3E6}
.dlog{font-size:14px;line-height:1.35;text-align:center;min-height:38px;font-style:italic;color:#F5E6C0}
.dbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dbtns .btn{font-size:14px}
.dbtns .btn.gold{--c:#F5C451}
@keyframes roll{from{transform:rotate(-200deg) scale(.4)}}

/* ======== NOVEL ======== */
#novel{overflow:hidden;background:#1E1838}
.stage{position:absolute;inset:0;background:var(--nbg,#FFE9F2);transition:background .6s}
.stage .sdeco{position:absolute;pointer-events:none}
.ntitle{position:absolute;left:58px;max-width:calc(100% - 170px);overflow:hidden;text-overflow:ellipsis;top:calc(12px + env(safe-area-inset-top,0px));transform:rotate(-2deg);background:#FF94BC;color:#fff;font-weight:800;font-size:13px;padding:5px 14px 6px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--ink);white-space:nowrap;z-index:5;font-variation-settings:"INFM" 100,"BNCE" 50}
.ntitle small{display:block;font-size:11px;text-align:center;opacity:.95}
.nx{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:10;padding:4px 9px}
.nchar{position:absolute;bottom:calc(210px + env(safe-area-inset-bottom,0px));width:min(46vw,230px);transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .3s,filter .3s}
.nchar.l{left:2%}.nchar.r{right:2%}
.nchar .wrap{position:relative}
.nchar .wrap svg{width:100%;height:auto;display:block}
.nchar .acc{position:absolute;font-size:calc(min(46vw,230px)*.22);line-height:1}
.nchar.dim{filter:brightness(.75) saturate(.7);transform:scale(.94)}
.nchar.talk{transform:translateY(-6px) scale(1.03)}
.nchar.hide{opacity:0;transform:translateY(30px)}
.nchar.r .wrap svg{transform:scaleX(-1)}
.nchar .mood{position:absolute;top:-6%;right:6%;font-size:30px;animation:pop .4s}
.nchar.l .mood{right:auto;left:6%}
.nbox{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:180px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:4px 5px 0 var(--ink);padding:24px 16px 14px;z-index:6;max-width:620px;margin:0 auto;cursor:pointer}
.nname{position:absolute;top:-17px;left:16px;background:var(--lilac);border:2.5px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:800;font-size:15px}
.nname:empty{display:none}
.ntext{font-size:17px;line-height:1.45;white-space:pre-wrap}
.ntext.narr{font-style:italic;color:var(--soft)}
.nchoices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.nchoices button{text-align:left;border:2px solid var(--ink);background:var(--butter);border-radius:14px;padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.nchoices button:nth-child(2){background:var(--pink)}
.nchoices button:nth-child(3){background:var(--lilac)}
.nchoices button:active{transform:translate(2px,3px);box-shadow:none}
.nnext{position:absolute;right:14px;bottom:8px;animation:blink 1s steps(2) infinite;font-size:14px;color:var(--soft)}
.tv{background:linear-gradient(135deg,#FFC2D9,#DCCEFF)!important}

/* ======== FACTS ======== */
.factbox{background:#FFF7D6;border:2px dashed #F5C451;border-radius:16px;padding:10px 12px;margin:12px 0 0;text-align:left;font-size:15px;line-height:1.4}
.factpop{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:110;max-width:520px;margin:0 auto;background:#FFF7D6;border:2.5px solid var(--ink);border-radius:20px;box-shadow:3px 4px 0 var(--ink);padding:12px 14px;display:flex;gap:10px;align-items:center;transform:translateY(calc(100% + 40px));transition:transform .45s cubic-bezier(.3,1.5,.5,1);color:var(--ink);font-size:15px;line-height:1.4;cursor:pointer}
.factpop.on{transform:none}
.factpop .fdino{flex:0 0 64px}
.factpop small{display:block;font-family:var(--hand);font-size:16px;color:var(--soft);margin-top:2px}
.peek{position:fixed;left:-8px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;width:96px;height:90px;border:0;background:none;padding:0;cursor:pointer;transform:translateX(-120%);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.peek.on{transform:translateX(0) rotate(8deg)}
.peek .pk{width:96px}
.peek .bulb{position:absolute;right:-6px;top:-14px;font-size:30px;animation:bob 1s ease-in-out infinite alternate}

/* ======== MODALS ======== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(58,46,107,.4)}
.modal.on{display:flex}
.card{background:var(--card);color:var(--ink);border-radius:28px;border:2.5px dashed var(--lilac2);padding:22px 18px;max-width:430px;width:100%;text-align:center;position:relative;animation:pop .5s cubic-bezier(.3,1.7,.5,1);max-height:88vh;overflow:auto}
.card h2{margin:0 0 6px;font-size:28px;line-height:1.1;font-variation-settings:"INFM" 100,"BNCE" 50;font-weight:800}
.card .sub{font-family:var(--hand);font-size:22px;color:var(--soft);line-height:1.15;margin:0 0 10px;font-weight:700}
.card .pic{width:120px;margin:0 auto 6px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stars{font-size:38px;letter-spacing:4px;margin:4px 0}
.stars .e{opacity:.25;filter:grayscale(1)}
.coupon{margin:12px 0;background:var(--butter);border-radius:20px;padding:14px;border:2px solid var(--ink);transform:rotate(-1.5deg)}
.coupon .k{font-family:var(--hand);font-size:20px;color:var(--soft);line-height:1}
.coupon .v{font-size:20px;font-weight:800;line-height:1.25;margin-top:4px}
.sig{font-family:var(--hand);font-size:22px;color:var(--pink2);margin:4px 0 0;font-weight:700}
.list{text-align:left;margin:8px 0;padding:0;list-style:none}
.list li{background:var(--sky);border-radius:14px;padding:8px 12px;margin:6px 0;font-size:15px;display:flex;gap:8px;align-items:center}
.list li b{font-family:var(--hand);font-size:20px;color:var(--pink2)}
.list li.done{background:var(--mint)}
.list li .grow{flex:1}
.pedia{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pedia div{background:var(--sky);border-radius:16px;padding:8px 4px 6px;font-size:12px;font-weight:700;line-height:1.1}
.pedia div svg{width:100%;height:56px}
.pedia div.no svg{filter:brightness(0) opacity(.18)}
.pedia div.gold{background:#FFF4CC}
.pedia em{display:block;font-style:normal;font-family:var(--hand);font-size:16px;color:var(--soft)}
textarea{width:100%;min-height:120px;border:2px solid var(--ink);border-radius:16px;padding:10px;font:inherit;font-size:16px;resize:vertical;-webkit-user-select:text;user-select:text}
.drawwrap{position:relative;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;touch-action:none}
#drawCanvas{display:block;width:100%;aspect-ratio:1;touch-action:none}
.swatches{display:flex;gap:6px;justify-content:center;margin:8px 0 0;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.swatches button.on{outline:3px solid var(--pink2);outline-offset:2px}
.task-ic{font-size:44px;line-height:1;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 80px));visibility:hidden;background:var(--card);color:var(--ink);border:2.5px solid var(--ink);border-radius:20px;padding:8px 18px;font-family:var(--hand);font-size:24px;font-weight:700;box-shadow:3px 4px 0 var(--pink2);z-index:120;transition:transform .45s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
.foot{text-align:center;font-family:var(--hand);font-size:20px;color:var(--soft);padding:22px 10px 10px}

@keyframes sway{to{transform:rotate(5deg)}}
@keyframes bob{to{transform:translateY(-8px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes caught{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-90%) scale(1.35) rotate(-10deg)}100%{transform:translate(-50%,-120%) scale(0);opacity:0}}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(40deg);opacity:0}}
@keyframes shake{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-4px 0}}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}}
@keyframes idle{to{transform:translateY(-6px) scale(1.02)}}
@keyframes hitshake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.item svg,.node.cur,.bossart .art{animation:none!important}}
</style>

<script>
(function(){
/* ================= DATA ================= */

const R = (a,b)=>a+RNG()*(b-a);

const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd = (a,b)=>a+Math.random()*(b-a);

const eye = (x,y,r=2.6)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
const smile = d=>`<path d="${d}" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const sparkles = `<g fill="#FFD34D"><path d="M-6 10l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M118 4l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>`;

/* ---------- динозавры ---------- */

};

/* ---------- декор ---------- */

let AC=null, MASTER=null, PULSE={};
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); MASTER=AC.createGain(); MASTER.gain.value=1; MASTER.connect(AC.destination);
    [.125,.25].forEach(d=>{ const n=32, re=new Float32Array(n), im=new Float32Array(n); for(let k=1;k<n;k++){ re[k]=0; im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d); } PULSE[d]=AC.createPeriodicWave(re,im); });
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function osc(type,f,t,dur,vol,to,dest){
  const c=AC, o=c.createOscillator(), g=c.createGain();
  if(type==='p12') o.setPeriodicWave(PULSE[.125]); else if(type==='p25') o.setPeriodicWave(PULSE[.25]); else o.type=type;
  o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur*.65); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(dest||MASTER); o.start(t); o.stop(t+dur+.03);
}
function tone(f,t0,dur,o={}){ const c=ac(); if(!c||muted) return; osc(o.type||'square',f,c.currentTime+t0,dur,o.vol||.07,o.to); }
let NOISE=null;
function noiseAt(t,dur,vol,hp){
  const c=AC; if(!NOISE){ const n=c.sampleRate, b=c.createBuffer(1,n,n), d=b.getChannelData(0); let v=0; for(let i=0;i<n;i++){ if(i%3===0) v=Math.random()*2-1; d[i]=v; } NOISE=b; }
  const s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter(); s.buffer=NOISE; f.type=hp?'highpass':'lowpass'; f.frequency.value=hp?6000:1200;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(MASTER); s.start(t,Math.random()*.5); s.stop(t+dur+.02);
}
function noise(t0,dur,vol=.06){ const c=ac(); if(!c||muted) return; noiseAt(c.currentTime+t0,dur,vol,false); }

function makeSong(seedStr, mood){
  const r = mulberry(hashStr(seedStr)); const ri=(a,b)=>a+Math.floor(r()*(b-a+1)); const pk=a=>a[Math.floor(r()*a.length)];
  const boss = mood==='boss', scaleName = boss ? pk(['minor','minorH','dorian']) : (mood||'major');
  const sc = SCALES[scaleName] || SCALES.major;
  const minorish = sc[2]===3;
  const root = (boss?45:48) + ri(0,7);
  const prog = pk(minorish?PROGS.minor:PROGS.major).map(d=>d % sc.length);
  const deg2midi = d=>{ const o=Math.floor(d/sc.length), i=((d%sc.length)+sc.length)%sc.length; return root+12+o*12+sc[i]; };
  const tempo = boss ? ri(150,176) : ri(112,150);
  const leadType = pk(['square','p25','p12','p25']);
  const bassStyle = ri(0,3), arpOn = r()<.6 || boss, drums = boss || r()<.55;
  const bars = [], melA = [];
  let cur = 7 + ri(0,2);
  for(let b=0;b<4;b++){
    const ch = prog[b], rh = pk(RHY), notes=[];
    for(let s=0;s<8;s++){
      if(!rh[s]){ notes.push(null); continue; }
      if(s%4===0){ const tones=[ch,ch+2,ch+4,ch+7]; let best=tones[0]; tones.forEach(t=>{ for(const o of [0,7,-7]) if(Math.abs(t+o-cur)<Math.abs(best-cur)) best=t+o; }); cur=best; }
      else cur += pk([-2,-1,-1,1,1,2,0,3,-3]);
      cur = Math.max(3, Math.min(14, cur));
      notes.push(cur);
    }
    melA.push(notes);
  }
  // A A' B A''
  const melB = melA.map((n,i)=> i<2 ? n.map(x=>x==null?null:x+ (i===1?2:0)) : n.map((x,j)=>x==null?(j%2?null:prog[i]+4):x+pk([0,1,2])));
  const mel = [...melA, ...melB];
  const steps = [];
  for(let b=0;b<8;b++){
    const ch = prog[b%4], bassRoot = root + sc[ch % sc.length] - (sc[ch%sc.length]>7?12:0);
    for(let s=0;s<8;s++){
      let bass;
      if(bassStyle===0) bass = s%2 ? bassRoot+12 : bassRoot;
      else if(bassStyle===1) bass = [bassRoot,null,bassRoot+7,null,bassRoot,bassRoot+7,bassRoot+12,null][s];
      else if(bassStyle===2) bass = [bassRoot,bassRoot,bassRoot+12,bassRoot,bassRoot+7,bassRoot,bassRoot+12,bassRoot+10][s];
      else bass = s%4===0 ? bassRoot : (s%4===2 ? bassRoot+7 : null);
      const m = mel[b][s];
      const arp = arpOn ? deg2midi(ch + [0,2,4,7][s%4]) + 12 : null;
      const drum = drums ? (s%4===0 ? 'k' : (s%4===2 ? 's' : 'h')) : null;
      steps.push({m: m==null?null:deg2midi(m), b:bass, a:arp, d:drum});
    }
  }
  return {tempo, steps, lead:leadType, boss};
}
let SONG=null, sStep=0, sNext=0, sTimer=null, songKey='';
function musTick(){
  if(!SONG) return;
  const stepDur = 60/SONG.tempo/2;
  while(sNext < AC.currentTime + .15){
    const st = SONG.steps[sStep % SONG.steps.length];
    if(st.m) osc(SONG.lead, NF(st.m), sNext, stepDur*.88, SONG.boss?.03:.024);
    if(st.b) osc('triangle', NF(st.b), sNext, stepDur*.8, .09);
    if(st.a && sStep%2===1) osc('p12', NF(st.a), sNext, stepDur*.5, .012);
    if(st.d==='k') osc('sine',150,sNext,.12,.12,40);
    else if(st.d==='s' && SONG.boss) noiseAt(sNext,.1,.05,false);
    else if(st.d==='h' && sStep%2) noiseAt(sNext,.03,.02,true);
    sNext += stepDur; sStep++;
  }
}
function playSong(key, mood){
  songKey = key; SONG = makeSong(key, mood);
  if(!musicOn) return;
  const c = ac(); if(!c) return;
  sStep = 0; sNext = c.currentTime + .08;
  ensureTimer();
}
function ensureTimer(){ if(!sTimer) sTimer = setInterval(()=>{ if(musicOn && SONG && AC){ if(sNext < AC.currentTime - .3) sNext = AC.currentTime + .05; musTick(); } }, 30); }
function stopSong(){ SONG=null; }

async function shareBlob(blob, name, text){

  const mechs = [[],["runners"],["divers"],["ghost"],["flash"],["runners","divers"],["flash","runners"]];
  const cfg = {t:"hunt", n:8+Math.floor(r()*5), mech:pk(mechs), clutter:20+Math.floor(r()*8), size:56+Math.floor(r()*8)};
  if(r()<.5) cfg.decoys = 3+Math.floor(r()*4);

  if(r()<.3){ cfg.filter = {type: pk(world.keys)}; cfg.extra = 10; cfg.n = 5; }

}
function describe(cfg){
  let d = cfg.filter ? (cfg.filter.type ? `Найди ${cfg.n} ${DGEN[cfg.filter.type]}` : cfg.filter.color ? `Найди ${cfg.n} розовых` : `Найди золотого`) : `Найди ${cfg.n} динозавров`;
  if(cfg.time) d += ` за ${cfg.time} секунд`;
  const m = cfg.mech||[]; const bits = [];

}

let H = null;
function startHunt(cfg, done){
  stopHunt();
  show('hunt');
  const W = cfg.world, field = $('field'), hud = document.querySelector('#hunt .hud');
  field.innerHTML = ''; field.style.setProperty('--bg', W.bg);
  field.style.top = (hud.offsetTop + hud.offsetHeight) + 'px';
  const FW = field.clientWidth, FH = field.clientHeight;
  const mech = cfg.mech || [];
  const k = Math.max(.6, FW*FH/(375*640));
  const s0 = cfg.size || 62;
  $('hHint').disabled=false; $('hHint').textContent='🔍';
  H = {cfg, done, found:0, mistakes:0, lives:3, t0:performance.now(), timeLeft:cfg.time||0, timers:[], raf:0, dinos:[], over:false, mx:FW/2, my:FH/2, combo:0, last:0, memActive:false, flies:[], newSpecies:[], gotGold:0};
  playSong(cfg.key, W.scale);

  $('hGoal').textContent = cfg.name || '';
  $('hTime').textContent = cfg.time ? `⏱ ${cfg.time}` : '';
  renderHud();

  // декор
  const nC = Math.round((cfg.clutter||20)*k);
  const cols = Math.max(3, Math.round(Math.sqrt(nC*FW/FH))), rows = Math.ceil(nC/cols);
  const cells = []; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cells.push([(c+.5)/cols*FW, (r+.5)/rows*FH]);
  shuffle(cells).slice(0,nC).forEach(([x,y])=>{ const kk = pick(W.decor); addItem(field, kk, x+R(-.35,.35)*FW/cols, y+R(-.35,.35)*FH/rows, DSZ[kk]*R(.75,1.15), RI(2,12)); });

  // динозавры
  const placed = [];
  const place = (s)=>{ let best=null, bd=-1; for(let t=0;t<40;t++){ const x=R(s/2+6, FW-s/2-6), y=R(s/2+10, FH-s/2-8); let d=1e9; placed.forEach(([px,py])=>{ d=Math.min(d, Math.hypot(px-x,py-y)); }); if(d>s*1.1){ best=[x,y]; break; } if(d>bd){ bd=d; best=[x,y]; } } placed.push(best); return best; };
  const f = cfg.filter;
  const specs = [];
  for(let i=0;i<cfg.n;i++){
    let key, pair, gold=false;
    if(f && f.type){ key=f.type; pair=pick(PAIRS); }
    else if(f && f.color){ key=pick(W.keys); pair=pick(GREENS); }
    else if(f && f.gold){ key=pick(W.keys); pair=PAIRS[0]; gold=true; }
    else { key=pick(W.keys); pair=pick(PAIRS); gold = Math.random()<1/40; }
    specs.push({kind:'target', key, pair, gold});
  }
  for(let i=0;i<(cfg.extra||0);i++){
    let key, pair;
    if(f && f.type){ const others = W.keys.concat(BASE_KEYS).filter(x=>x!==f.type); key=pick(others); pair=pick(PAIRS); }
    else if(f && f.color){ key=pick(W.keys); pair=pick(NONGREEN); }
    else { key=pick(W.keys); pair=pick(PAIRS); }
    specs.push({kind:'extra', key, pair});
  }
  for(let i=0;i<(cfg.decoys||0);i++) specs.push({kind:'decoy', key:pick(['lizard','croc']), pair:pick(PAIRS)});
  const wIdx = WORLDS.indexOf(W);
  if(!S.bubo && wIdx>=1 && !mech.includes('memory') && (cfg.key==='4-0' || Math.random()<.12)) specs.push({kind:'bubo'});
  if(!mech.includes('memory') && Math.random()<.5) specs.push({kind:'nerd', key:pick(BASE_KEYS), pair:pick(PAIRS)});

  shuffle(specs).forEach(sp=>{
    const s = sp.kind==='bubo' ? s0*1.15 : sp.kind==='decoy' ? s0*1.2 : s0*(DSIZE[sp.key]||1);
    const [x,y] = place(s);
    const b = document.createElement('button');
    b.className = 'dino' + (sp.gold?' gold':'');
    b.setAttribute('aria-label','?');
    b.style.cssText = `left:${x}px;top:${y}px;width:${s}px;--w:${s}px;--r:${R(-12,12)}deg;--fx:${Math.random()<.5?-1:1};z-index:6`;
    b.innerHTML = sp.kind==='bubo' ? bubozavr() : sp.kind==='decoy' ? DECOYS[sp.key](pick(["#C3EBD3","#7FD3A2","#DCCEFF","#FFD2B8"]), "#fff") : dinoSvg(sp.key, sp.pair, sp.gold);
    if(sp.kind==='nerd') b.insertAdjacentHTML('beforeend', '<span class="acc2" style="top:-18%;left:40%">💡</span>');
    else if((sp.kind==='target'||sp.kind==='extra') && Math.random()<.45) b.insertAdjacentHTML('beforeend', `<span class="acc2">${pick(['☕','💼','📱','📎','🧾','🎧'])}</span>`);
    const d = {el:b, sp, s, x, y, next:performance.now()+R(300,2500), under:false};
    b.addEventListener('click', e=>{ e.stopPropagation(); tapDino(d, e); });
    field.appendChild(b);
    H.dinos.push(d);
    if(mech.includes('ghost')) b.classList.add('ghost');
    if(mech.includes('runners')) b.classList.add('run');
    if(sp.kind==='bubo' || Math.random()<.6){
      const kk = pick(W.big), w = Math.min(DSZ[kk], s*1.7);
      addItem(field, kk, x+R(-s*.15,s*.15), y + s*R(.35,.55) + w*.2, w, 10);
    }
  });

  // механики
  if(mech.includes('runners') || mech.includes('divers')){
    H.timers.push(setInterval(()=>{
      const now = performance.now();
      H.dinos.forEach(d=>{
        if(d.gone || now < d.next) return;
        if(mech.includes('divers') && (!mech.includes('runners') || Math.random()<.5)){

let B = null;
const BW = 200;
function startBoss(i, done){
  stopBoss(); show('boss');
  const D = BOSSES[i];
  B = {i, D, done, hp:D.hp, php:30, pmax:30, mercy:0, nastya:false, turn:0, items:{cookie:3, kiss:1, sandwich:2}, phase:'intro', spare:false, kiss:false, bullets:[], hx:100, hy:60, inv:0, raf:0, typing:null, next:null, keys:{}, dark:false};
  $('bArt').className = 'art'; $('bArt').innerHTML = D.art(false);
  $('bNameT').textContent = D.name; $('bName').classList.remove('spare');
  updBars();
  playSong('boss-'+i, 'boss');
  enableActs(false);
  say(D.intro, menu);
}
function updBars(){ $('bHp').style.width = Math.max(0,B.hp/B.D.hp*100)+'%'; $('pHp').style.width = Math.max(0,B.php/B.pmax*100)+'%'; $('pHpT').textContent = `${Math.max(0,B.php)}/${B.pmax}`; }
function enableActs(on){ ['aFight','aAct','aItem','aMercy'].forEach(id=>$(id).disabled = !on); }
function boxMode(m){ $('bTxt').style.display = m==='txt'?'block':'none'; $('bOpts').style.display = m==='opts'?'flex':'none'; $('bBar').style.display = m==='bar'?'block':'none'; $('bCanvas').style.display = m==='cv'?'block':'none'; }
function say(lines, then, auto){
  boxMode('txt'); lines = [].concat(lines); let li=0;
  const run = ()=>{
    const full = lines[li]; let n = 0; const el = $('bTxt'); el.textContent='';
    clearInterval(B.typing);
    B.typing = setInterval(()=>{ n++; el.textContent = full.slice(0,n); if(n%2===0 && full[n-1]!==' ') sfx.type(); if(n>=full.length){ clearInterval(B.typing); B.typing=null; if(!auto){ const t=document.createElement('span'); t.className='tapnext'; t.textContent='▼ нажми'; el.appendChild(t); } } }, 28);
    B.next = ()=>{
      if(B.typing){ clearInterval(B.typing); B.typing=null; el.textContent = full; if(!auto){ const t=document.createElement('span'); t.className='tapnext'; t.textContent='▼ нажми'; el.appendChild(t); } return; }
      if(auto) return;
      li++; if(li<lines.length) run(); else { B.next=null; then && then(); }
    };
  };
  run();
}
$('bBox').addEventListener('click', ()=>{ if(B && B.phase!=='defend' && B.next) B.next(); });
function menu(){
  if(!B) return;
  B.phase = 'menu'; enableActs(true);
  say(B.spare ? B.D.spareReady : pick(B.D.idle), null, true);
}
$('aFight').onclick = ()=>{
  if(!B || B.phase!=='menu') return; sfx.blip(); B.phase='fight'; enableActs(false); boxMode('bar');
  let pos=0, dir=1, stopped=false; const cur=$('bCur'), bar=$('bBar');
  const anim = ()=>{ if(!B || stopped) return; pos += dir*.022; if(pos>1){pos=1;dir=-1;} if(pos<0){pos=0;dir=1;} cur.style.left = `calc(${pos*100}% - 3px)`; B.raf=requestAnimationFrame(anim); };
  anim();
  const stop = (e)=>{ e && e.stopPropagation(); if(stopped) return; stopped=true; cancelAnimationFrame(B.raf); document.removeEventListener('pointerdown', stop, true);
    const acc = 1 - Math.min(1, Math.abs(pos-.5)/.5); const dmg = Math.max(3, Math.round(4 + acc*18 + (acc>.9?6:0)));
    B.hp -= dmg; sfx.hit(); updBars();
    const art=$('bArt'); art.classList.remove('hit'); void art.offsetWidth; art.classList.add('hit');
    const d=document.createElement('div'); d.className='dmg'; d.textContent = acc>.9 ? `${dmg}!!` : dmg; art.parentElement.appendChild(d); setTimeout(()=>d.remove(),1000);
    setTimeout(()=>{
      if(!B) return;
      if(B.hp<=0){ $('bArt').innerHTML = B.D.art(true); $('bArt').classList.add('happy'); say([`* ${B.D.name} повержен!`, '* '+B.D.fightEnd], ()=>endBoss(true,false)); }
      else say(acc>.9 ? '* КРИТИЧЕСКИЙ УДАР!' : acc>.5 ? '* Хороший удар!' : '* Скользящий удар.', enemyTurn);
    }, 500);
  };
  setTimeout(()=>document.addEventListener('pointerdown', stop, true), 150);
};
$('aAct').onclick = ()=>{
  if(!B || B.phase!=='menu') return; sfx.blip(); B.phase='opts'; boxMode('opts');
  const o = $('bOpts'); o.innerHTML = '';
  B.D.acts.forEach(a=>{ const b=document.createElement('button'); b.textContent = a.n; b.onclick = e=>{ e.stopPropagation(); doAct(a); }; o.appendChild(b); });
  const back=document.createElement('button'); back.textContent='Назад'; back.onclick=e=>{ e.stopPropagation(); menu(); }; o.appendChild(back);
};
function doAct(a){
  sfx.blip(); enableActs(false); B.phase='talk';
  if(a.nastya){ if(B.nastya){ say('* Команда уже рядом с тобой!', enemyTurn); return; } B.nastya = true; sfx.heal(); }
  const was = B.spare;
  if(!a.used){ B.mercy += a.m; } else if(a.m) B.mercy += .5;
  a.used = true;
  const ready = B.mercy >= B.D.need && (!B.D.final || B.nastya);
  if(ready && !was){ B.spare = true; $('bName').classList.add('spare'); }
  say(ready && !was ? [a.t, B.D.spareReady] : a.t, enemyTurn);
}
$('aItem').onclick = ()=>{
  if(!B || B.phase!=='menu') return; sfx.blip(); B.phase='opts'; boxMode('opts');
  const o = $('bOpts'); o.innerHTML = '';
  const list = [['cookie',`Печенька с переговорки ×${B.items.cookie} (+12)`],['sandwich',`Кофе ×${B.items.sandwich} (+7)`],['kiss',`Мем от коллеги ×${B.items.kiss} (неуязвимость)`]];
  list.forEach(([k,t])=>{ if(!B.items[k]) return; const b=document.createElement('button'); b.textContent=t; b.onclick=e=>{ e.stopPropagation(); useItem(k); }; o.appendChild(b); });
  if(!o.children.length){ const p=document.createElement('button'); p.textContent='Карманы пусты…'; p.onclick=e=>{e.stopPropagation(); menu();}; o.appendChild(p); }
  const back=document.createElement('button'); back.textContent='Назад'; back.onclick=e=>{ e.stopPropagation(); menu(); }; o.appendChild(back);
};
function useItem(k){
  enableActs(false); B.phase='talk'; B.items[k]--; sfx.heal();
  let t;
  if(k==='cookie'){ B.php = Math.min(B.pmax, B.php+12); t='* Ты стащил печеньку с переговорки.\n* Никто не видел. +12'; }
  else if(k==='sandwich'){ B.php = Math.min(B.pmax, B.php+7); t='* Ты выпил кофе.\n* Глаз дёргается, но силы есть. +7'; }
  else { B.kiss = true; t='* Коллега прислал мем.\n* Ты так смеёшься, что следующая атака тебе не страшна!'; }
  updBars(); say(t, enemyTurn);
}
$('aMercy').onclick = ()=>{
  if(!B || B.phase!=='menu') return; sfx.blip(); enableActs(false); B.phase='talk';
  if(B.spare){ $('bArt').innerHTML = B.D.art(true); $('bArt').classList.add('happy'); playSong('spare-'+B.i,'major'); say(['* Ты протянул руку.', '* '+B.D.spareEnd], ()=>endBoss(true,true)); }
  else if(B.D.final && B.mercy>=B.D.need && !B.nastya) say('* Метеорит слишком огромный… Одному не справиться.\n* Может, позвать команду?', enemyTurn);
  else say(`* ${B.D.name} пока не хочет мириться.`, enemyTurn);
};

function enemyTurn(){
  if(!B) return;
  B.phase='defend'; enableActs(false); boxMode('cv');
  const cv = $('bCanvas'), dpr = Math.min(2, devicePixelRatio||1);
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
  B.sc = cv.width/BW; B.BH = cv.height/B.sc;
  B.hx = BW/2; B.hy = B.BH/2; B.bullets = []; B.t = 0; B.acc = {}; B.dark = false; B.inv = 0;
  const pats = B.D.pats[Math.min(B.turn, B.D.pats.length-1)];
  B.cur = pats; if(pats.includes('dark')) B.dark = true;
  B.lvl = 1 + Math.min(B.turn,8)*.07 + (B.D.final && B.hp < B.D.hp*.5 ? .15 : 0);
  B.dur = B.D.final ? 7.5 : 6.5;
  B.last = performance.now();
  B.raf = requestAnimationFrame(defendLoop);
}
function every(key, sec){ B.acc[key] = (B.acc[key]||0) + 1/60; if(B.acc[key] >= sec){ B.acc[key] -= sec; return true; } return false; }
function aimAt(x,y,sp){ const a = Math.atan2(B.hy-y, B.hx-x); return [Math.cos(a)*sp, Math.sin(a)*sp]; }
const PAT = {
  fall(){ if(every('fall', .5/B.lvl)) B.bullets.push({k:'txt', s:pick(B.D.words.fall||['!!!']), x:R(14,BW-14), y:-8, vx:0, vy:R(1,1.5)*B.lvl, r:7}); },
  side(){ if(every('side', .6/B.lvl)){ const l = Math.random()<.5; B.bullets.push({k:'txt', s:pick(B.D.words.side||['!!!']), x:l?-30:BW+30, y:R(10,B.BH-10), vx:(l?1:-1)*1.6*B.lvl, vy:0, r:6}); } },
  ring(){ if(every('ring', 1.6)) B.bullets.push({k:'ring', cx:BW/2, cy:B.BH/2, rad:4, vr:.85*B.lvl, ga:R(0,6.28), gw:1.2, life:220}); },
  alarm(){ if(every('alarm', 1.5)) B.bullets.push({k:'ring', cx:BW/2, cy:B.BH/2, rad:4, vr:.9*B.lvl, ga:R(0,6.28), gw:1.1, life:200}); },
  rain(){ if(every('rain', .075/B.lvl)) B.bullets.push({k:'drop', x:R(-40,BW), y:-6, vx:.7, vy:2.6*B.lvl, r:2.2}); },
  bolt(){ if(every('bolt', 1.15)) B.bullets.push({k:'bolt', x: Math.random()<.5 ? B.hx : R(10,BW-10), w:18, warn:42, strike:20}); },
  hail(){ if(every('hail', .38/B.lvl)) B.bullets.push({k:'ball', x:R(6,BW-6), y:-6, vx:R(-.4,.4), vy:.6, ay:.06, r:4, bounce:1}); },
  hands(){ if(every('hands', 1.1/B.lvl)){ const l=Math.random()<.5, y=R(8,B.BH-8); B.bullets.push({k:'hand', x:l?-80:BW, y:y-7, w:80, h:14, vx:(l?1:-1)*2*B.lvl, vy:0}); } },
  eyes(){ if(every('eyes', .75/B.lvl)){ const e=Math.floor(R(0,4)); let x,y; if(e===0){x=R(0,BW);y=-6;} else if(e===1){x=BW+6;y=R(0,B.BH);} else if(e===2){x=R(0,BW);y=B.BH+6;} else {x=-6;y=R(0,B.BH);} const [vx,vy]=aimAt(x,y,1.1*B.lvl); B.bullets.push({k:'eye', x,y,vx,vy,r:5}); } },
  dark(){},
  sand(){ if(!B.streams) B.streams=[R(20,60),R(80,120),R(140,180)]; B.streams = B.streams.map((s,i)=>s + Math.sin(B.t/40+i*2)*.6); if(every('sand', .045/B.lvl)){ const s = pick(B.streams); B.bullets.push({k:'grain', x:s+R(-4,4), y:-4, vx:0, vy:2.2*B.lvl, r:2}); } },
  tables(){ if(every('tables', 1.0/B.lvl)){ const l=Math.random()<.5, y=R(10,B.BH-10); B.bullets.push({k:'table', x:l?-60:BW, y:y-8, w:60, h:16, vx:(l?1:-1)*1.5*B.lvl, vy:0}); } },
  aim(){ if(every('aim', .75/B.lvl)){ const x = Math.random()<.5 ? -10 : BW+10, y=R(0,B.BH); const [vx,vy]=aimAt(x,y,1.4*B.lvl); B.bullets.push({k:'txt', s:pick(B.D.words.aim||['ASAP']), x,y,vx,vy,r:7}); } },
  meteor(){ if(every('meteor', .3/B.lvl)){ const r=R(4,8); B.bullets.push({k:'meteor', x:R(BW*.3,BW+40), y:-10, vx:-1.1*B.lvl, vy:1.7*B.lvl, r}); } },
  firering(){ if(every('firering', 1.7)) B.bullets.push({k:'ring', cx:B.hx, cy:B.hy, rad:120, vr:-1.15*B.lvl, ga:R(0,6.28), gw:1.0, life:200, fire:true}); },
  storm(){ if(every('storm', .16/B.lvl)){ const a=R(0,6.28), x=BW/2+Math.cos(a)*130, y=B.BH/2+Math.sin(a)*130; const [vx,vy]=aimAt(x,y,1.5*B.lvl); B.bullets.push({k:'meteor', x,y,vx,vy,r:4}); } }
};
function defendLoop(now){
  if(!B || B.phase!=='defend') return;
  const steps = Math.min(4, Math.max(1, Math.round((now - B.last)/(1000/60)))); B.last = now;
  for(let s=0;s<steps;s++){ defendStep(); if(!B || B.phase!=='defend') return; }
  drawDefend();
  B.raf = requestAnimationFrame(defendLoop);
}
function defendStep(){
  B.t++;
  const sp = 1.7; const k = B.keys;
  if(k.ArrowLeft) B.hx -= sp; if(k.ArrowRight) B.hx += sp; if(k.ArrowUp) B.hy -= sp; if(k.ArrowDown) B.hy += sp;
  B.hx = Math.max(6, Math.min(BW-6, B.hx)); B.hy = Math.max(6, Math.min(B.BH-6, B.hy));
  if(B.t > 30) B.cur.forEach(p=>PAT[p]());
  if(B.inv>0) B.inv--;
  const na = B.t*.08, nx = B.hx+Math.cos(na)*14, ny = B.hy+Math.sin(na)*14;
  B.bullets = B.bullets.filter(b=>{
    let hit = false;
    if(b.k==='ring'){ b.rad += b.vr; b.life--; const d=Math.hypot(B.hx-b.cx,B.hy-b.cy); if(Math.abs(d-b.rad)<4){ let a=Math.atan2(B.hy-b.cy,B.hx-b.cx); let diff=Math.abs(((a-b.ga)%6.283+9.42)%6.283-3.14); if(diff > b.gw/2) hit=true; } if(b.rad<2 || b.rad>260 || b.life<=0) return false; }
    else if(b.k==='bolt'){ if(b.warn>0) b.warn--; else { b.strike--; if(Math.abs(B.hx-b.x)<b.w/2+3) hit=true; if(b.strike<=0) return false; } }
    else if(b.k==='hand' || b.k==='table'){ b.x+=b.vx; if(B.hx+4>b.x && B.hx-4<b.x+b.w && B.hy+4>b.y && B.hy-4<b.y+b.h) hit=true; if(b.x<-100||b.x>BW+100) return false; }
    else {
      b.x+=b.vx; b.y+=b.vy; if(b.ay) b.vy+=b.ay;
      if(b.k==='ball' && b.y>B.BH-b.r && b.bounce){ b.bounce--; b.vy=-Math.abs(b.vy)*.55; }
      if(Math.hypot(B.hx-b.x,B.hy-b.y) < b.r+3.5) hit=true;
      if(B.nastya && Math.hypot(nx-b.x,ny-b.y) < b.r+4){ return false; }
      if(b.x<-60||b.x>BW+60||b.y<-60||b.y>B.BH+60) return false;
    }
    if(hit && B.inv<=0 && !B.kiss){ B.php -= B.D.final?5:4; B.inv = 50; sfx.hurt(); updBars(); try{ navigator.vibrate && navigator.vibrate(50); }catch(_){}
      if(B.php<=0){ loseBoss(); return false; }
      if(b.k!=='ring' && b.k!=='bolt' && b.k!=='hand' && b.k!=='table') return false; }
    return true;
  });
  if(!B || B.phase!=='defend') return;
  if(B.t >= B.dur*60){ B.turn++; B.kiss=false; B.bullets=[]; B.phase='menu'; menu(); }
}
function drawDefend(){
  const cv=$('bCanvas'), cx=cv.getContext('2d'); cx.setTransform(B.sc,0,0,B.sc,0,0);
  cx.fillStyle='#000'; cx.fillRect(0,0,BW,B.BH);
  B.bullets.forEach(b=>{
    if(b.k==='txt'){ cx.fillStyle='#fff'; cx.font=(b.s.length>8?'bold 8px':'bold 10px')+' "Shantell Sans", sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(b.s,b.x,b.y); }
    else if(b.k==='ring'){ cx.strokeStyle = b.fire ? '#FFAF7E' : '#fff'; cx.lineWidth=3; cx.beginPath(); cx.arc(b.cx,b.cy,Math.max(1,b.rad),b.ga+b.gw/2,b.ga-b.gw/2+6.283); cx.stroke(); }
    else if(b.k==='bolt'){ if(b.warn>0){ cx.strokeStyle='rgba(255,229,154,'+(.3+.3*Math.sin(B.t))+')'; cx.setLineDash([4,4]); cx.lineWidth=1.5; cx.strokeRect(b.x-b.w/2,0,b.w,B.BH); cx.setLineDash([]); } else { cx.fillStyle='#FFE59A'; cx.fillRect(b.x-b.w/2,0,b.w,B.BH); cx.fillStyle='#fff'; cx.fillRect(b.x-2,0,4,B.BH); } }
    else if(b.k==='hand'){ cx.fillStyle='#6B5B9A'; rrect(cx,b.x,b.y,b.w,b.h,6); cx.fill(); cx.fillStyle='#B399FF'; for(let i=0;i<3;i++) cx.fillRect(b.vx>0?b.x+b.w-2:b.x-6, b.y+1+i*4.5, 8, 3); }
    else if(b.k==='table'){ cx.fillStyle='#fff'; cx.fillRect(b.x,b.y,b.w,b.h); cx.strokeStyle='#86BCFF'; cx.lineWidth=1; for(let i=1;i<4;i++){ cx.beginPath(); cx.moveTo(b.x+i*b.w/4,b.y); cx.lineTo(b.x+i*b.w/4,b.y+b.h); cx.stroke(); } cx.beginPath(); cx.moveTo(b.x,b.y+b.h/2); cx.lineTo(b.x+b.w,b.y+b.h/2); cx.stroke(); }
    else if(b.k==='eye'){ cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(b.x,b.y,b.r+1,b.r-1,0,0,7); cx.fill(); cx.fillStyle='#FFE59A'; cx.beginPath(); cx.arc(b.x,b.y,2.2,0,7); cx.fill(); }
    else if(b.k==='meteor'){ cx.strokeStyle='rgba(255,175,126,.6)'; cx.lineWidth=b.r; cx.beginPath(); cx.moveTo(b.x,b.y); cx.lineTo(b.x-b.vx*6,b.y-b.vy*6); cx.stroke(); cx.fillStyle='#FFAF7E'; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.fill(); }
    else if(b.k==='drop'){ cx.strokeStyle='#86BCFF'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(b.x,b.y); cx.lineTo(b.x-b.vx*3,b.y-b.vy*3); cx.stroke(); }
    else { cx.fillStyle = b.k==='grain' ? '#FFE59A' : '#fff'; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.fill(); }
  });
  if(B.dark){ const g=cx.createRadialGradient(B.hx,B.hy,14,B.hx,B.hy,46); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)'); cx.fillStyle=g; cx.fillRect(0,0,BW,B.BH); }
  if(B.nastya){ const na=B.t*.08; cx.fillStyle='#FFC2D9'; heartPath(cx, B.hx+Math.cos(na)*14, B.hy+Math.sin(na)*14-4, 8); }
  if(!(B.inv>0 && Math.floor(B.t/4)%2)){ cx.fillStyle = B.kiss ? '#FFE59A' : '#FF4F8B'; heartPath(cx, B.hx, B.hy-5, 10); }
  // таймер хода
  cx.fillStyle='rgba(255,255,255,.25)'; cx.fillRect(0,B.BH-2,BW*(1-B.t/(B.dur*60)),2);
}

let drag = null;
$('boss').addEventListener('pointerdown', e=>{ if(B && B.phase==='defend'){ drag = {x:e.clientX, y:e.clientY}; e.preventDefault(); } });
addEventListener('pointermove', e=>{ if(!drag || !B || B.phase!=='defend') return; const k = BW/$('bCanvas').clientWidth*1.25; B.hx = Math.max(6,Math.min(BW-6,B.hx+(e.clientX-drag.x)*k)); B.hy = Math.max(6,Math.min(B.BH-6,B.hy+(e.clientY-drag.y)*k)); drag = {x:e.clientX, y:e.clientY}; });
addEventListener('pointerup', ()=>drag=null); addEventListener('pointercancel', ()=>drag=null);
addEventListener('keydown', e=>{ if(B && e.key.startsWith('Arrow')){ B.keys[e.key]=true; e.preventDefault(); } });
addEventListener('keyup', e=>{ if(B) B.keys[e.key]=false; });
function loseBoss(){
  B.phase='lost'; cancelAnimationFrame(B.raf); boxMode('txt'); sfx.lose();
  say(['* Ты устал…', '* Сходи за кофе и попробуй ещё раз!'], ()=>endBoss(false,false));
}
function endBoss(win, spared){ const d=B.done; stopBoss(); d({win, spared}); }
function stopBoss(){ if(!B) return; cancelAnimationFrame(B.raf); clearInterval(B.typing); BOSSES.forEach(D=>D.acts.forEach(a=>a.used=false)); B=null; }

let NV = null;
function playStory(lines, title, done, replay){
  show('novel');
  NV = {lines:lines.slice(), i:0, queue:[], l:null, r:null, typing:null, done, replay};
  $('nL').innerHTML=''; $('nR').innerHTML=''; $('nL').classList.add('hide'); $('nR').classList.add('hide');
  $('nTitle').innerHTML = `📖 ${title}<small>«Юрский офис» · история</small>`;
  nvStep();
}
function nvSetChar(side, id){
  const el = $(side==='l'?'nL':'nR');
  if(id===undefined) return;
  if(id===null){ el.classList.add('hide'); NV[side]=null; return; }
  if(NV[side]!==id){
    const C = NCH[id];
    const acc = C.acc.map(([e,x,y])=>`<span class="acc" style="left:${side==='r'?100-x-20:x}%;top:${y}%">${e}</span>`).join('');
    el.innerHTML = `<div class="wrap">${C.art()}${acc}</div>`;
    NV[side]=id;
  }
  el.classList.remove('hide');
}
function nvRender(s){
  if(s.bg){ const B_ = NBG[s.bg]; $('nStage').style.setProperty('--nbg', B_.bg); $('nStage').querySelectorAll('.sdeco').forEach(x=>x.remove()); B_.deco.forEach((d,i)=>{ const e=document.createElement('div'); e.className='sdeco'; e.style.cssText=`width:${DSZ[d]*1.1}px;${['left:4%;top:16%','right:6%;top:24%','left:42%;top:34%'][i]};opacity:.7`; e.innerHTML=DECOR[d](); $('nStage').appendChild(e); }); playSong('story-'+s.bg, s.bg==='night'||s.bg==='fire'?'dorian':'major'); }
  nvSetChar('l', s.l); nvSetChar('r', s.r);
  const spSide = s.sp && NV.l===s.sp ? 'l' : s.sp && NV.r===s.sp ? 'r' : null;
  ['l','r'].forEach(sd=>{ const el=$(sd==='l'?'nL':'nR'); el.classList.toggle('talk', spSide===sd); el.classList.toggle('dim', !!spSide && spSide!==sd); el.querySelectorAll('.mood').forEach(m=>m.remove()); });
  if(s.mood) Object.entries(s.mood).forEach(([sd,em])=>{ const el=$(sd==='l'?'nL':'nR'); const m=document.createElement('span'); m.className='mood'; m.textContent=em; el.appendChild(m); });
  $('nName').textContent = s.sp ? NCH[s.sp].name : '';
  $('nCh').innerHTML = '';
  const tx = $('nText'); tx.classList.toggle('narr', !s.sp); tx.textContent = '';
  $('nNext').style.display = 'none';
  const full = s.t || ''; let n = 0;
  clearInterval(NV.typing);
  NV.typing = setInterval(()=>{ n++; tx.textContent = full.slice(0,n); if(n%2===0) sfx.type(); if(n>=full.length){ clearInterval(NV.typing); NV.typing=null; $('nNext').style.display='block'; } }, 22);
  NV.full = full;
}
function nvStep(){
  if(!NV) return;
  if(NV.queue.length){ nvRender(NV.queue.shift()); return; }
  const s = NV.lines[NV.i++];
  if(!s){ nvFinish(); return; }
  if(s.ch){
    clearInterval(NV.typing); NV.typing=null;
    $('nName').textContent = ''; $('nText').classList.add('narr'); $('nText').textContent = 'Что ответишь?'; $('nNext').style.display='none';
    ['l','r'].forEach(sd=>$(sd==='l'?'nL':'nR').classList.remove('talk','dim'));
    const box = $('nCh'); box.innerHTML='';
    s.ch.forEach(c=>{ const b=document.createElement('button'); b.textContent=c.t; b.onclick=e=>{ e.stopPropagation(); sfx.blip(); if(!NV.replay){ S.story.w += c.w||0; S.story.c += c.c||0; save(); } NV.queue = c.res.slice(); box.innerHTML=''; nvStep(); }; box.appendChild(b); });
    return;
  }
  nvRender(s);
}
$('nBox').addEventListener('click', ()=>{
  if(!NV || $('nCh').children.length) return;
  if(NV.typing){ clearInterval(NV.typing); NV.typing=null; $('nText').textContent = NV.full; $('nNext').style.display='block'; return; }
  nvStep();
});
function nvFinish(){ const d = NV && NV.done; if(NV) clearInterval(NV.typing); NV = null; if(d) d(); }
$('nX').onclick = ()=>{ if(NV) nvFinish(); };

/* --- кампания --- */
function chapter(id){ return CHAPTERS.find(c=>c.id===id); }
function storyBefore(w, then){
  const ch = chapter('in'+w);
  if(!ch || S.seenCh[ch.id]){ then(); return; }
  S.seenCh[ch.id] = true; save();
  playStory(ch.lines, ch.title, then);
}
function storyAfter(w, then){
  if(w===4){ storyEnding(then); return; }
  const ch = chapter('out'+w);
  if(!ch || S.seenCh[ch.id]){ then(); return; }
  S.seenCh[ch.id] = true; save();
  playStory(ch.lines, ch.title, then);
}
function endingKey(){ const d = S.story.w - S.story.c; return d>=2 ? 'senior' : d<=-2 ? 'vacation' : 'coffee'; }
function storyEnding(then){
  const key = endingKey(), E = ENDINGS[key];
  const lines = E.lines.slice();
  if(Object.keys(S.spared).length>=5) lines.push({sp:null, t:"P.S. Ты ни разу никого не победил силой — всех уговорил. В холдинге тебя называют «Добрая душа». Даже Понедельник шлёт тебе открытки."});
  S.endings[key] = true; S.seenCh['end'] = key; save();
  playStory(lines, 'Финал: '+E.title, ()=>{
    sfx.fanfare();
    const got = Object.keys(S.endings).length;
    modal(`<div class="pic">${NCH[E.art].art()}</div><p class="sub">концовка ${got} из 3</p><h2>«${E.title}»</h2><p>Конец истории. Спасибо, что прошёл всю карьеру в «Юрском офисе»! 🦖</p><p class="sub" style="font-size:18px">Концовка зависит от твоих ответов в главах: больше рвения — повышение, больше заботы о себе — отпуск, поровну — кофейня. Начать карьеру заново можно в «📖 Истории».</p><div class="row"><button class="btn big" id="mOk" style="--c:var(--mint)">Дальше ▶</button></div>`, ()=>{ $('mOk').onclick=()=>{ closeModal(); then(); }; });
  });
}
function storyMenu(){
  const items = CHAPTERS.filter(c=>S.seenCh[c.id] || UNLOCK_ALL).map(c=>`<li><span class="grow">${c.title}</span><button class="btn" data-ch="${c.id}" style="--c:var(--lilac);padding:4px 8px;font-size:13px">▶</button></li>`).join('');
  const endItem = S.seenCh['end'] ? `<li><span class="grow">Финал: «${ENDINGS[S.seenCh['end']].title}»</span><button class="btn" data-end="1" style="--c:var(--pink);padding:4px 8px;font-size:13px">▶</button></li>` : '';
  const got = Object.keys(S.endings).length;
  const lean = S.story.w - S.story.c;
  const meter = lean>=2 ? 'карьерист 📈' : lean<=-2 ? 'ценитель отдыха 🏝' : 'золотая середина ☕';
  modal(`<h2>📖 История</h2><p class="sub">концовок открыто: ${got}/3 · твой стиль сейчас: ${meter}</p><ul class="list">${items||'<li>История начнётся, когда ты выйдешь на работу (уровень 1-1)</li>'}${endItem}</ul><div class="row"><button class="btn" id="mReset" style="--c:#fff;font-size:13px">↺ Начать карьеру заново</button><button class="btn" id="mOk" style="--c:var(--mint)">Закрыть</button></div>`, ()=>{
    $('mOk').onclick = closeModal;
    document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const c=chapter(b.dataset.ch); closeModal(); playStory(c.lines, c.title, goMap, true); });
    const eb = document.querySelector('[data-end]'); if(eb) eb.onclick=()=>{ const E=ENDINGS[S.seenCh['end']]; closeModal(); playStory(E.lines, 'Финал: '+E.title, goMap, true); };
    $('mReset').onclick = ()=>{
      modal(`<h2>Начать заново?</h2><p>Уровни, история и выборы сбросятся. Динопедия, факты, грамоты и найденные концовки останутся.</p><div class="row"><button class="btn" id="mNo" style="--c:#fff">Отмена</button><button class="btn big" id="mYes" style="--c:var(--pink)">Да, новая карьера</button></div>`, ()=>{
        $('mNo').onclick = closeModal;
        $('mYes').onclick = ()=>{ S.done = {}; S.spared = {}; S.seenCh = {}; S.story = {w:0,c:0}; save(); closeModal(); goMap(); toast('Новая карьера началась! 🦖'); };
      });
    };
  });
}

let MG = null;
function mgStart(cfg, done, title){
  stopMini(); show('mini');
  $('mini').classList.toggle('grim', !!cfg.grim);
  const st = $('mStage'), hud = document.querySelector('#mini .hud');
  st.innerHTML = ''; st.style.setProperty('--bg', cfg.world ? cfg.world.bg : '#EEF0FF');
  st.style.top = (hud.offsetTop + hud.offsetHeight) + 'px';
  $('mGoal').textContent = title || cfg.name || '';
  $('mTime').textContent = ''; $('mProg').textContent = '';
  MG = {cfg, done, lives:3, mistakes:0, score:0, timers:[], over:false, t0:performance.now()};
  playSong(cfg.key, cfg.world ? cfg.world.scale : 'minor');
  mgLives();
  return st;
}
function mgLives(){ $('mLives').textContent = MG.cfg.grim ? '' : '❤️'.repeat(Math.max(0,MG.lives)) + '🤍'.repeat(Math.max(0,3-MG.lives)); }
function mgMistake(txt){ MG.mistakes++; MG.lives--; sfx.bad(); mgLives(); try{ navigator.vibrate && navigator.vibrate([40,40,40]); }catch(_){} if(txt) toast(txt); const st=$('mStage'); st.classList.remove('shakeit'); void st.offsetWidth; st.classList.add('shakeit'); if(MG.lives<=0) mgEnd(false, pick(LOSE_LINES)); }
function mgEnd(win, msg, stars){
  if(!MG || MG.over) return; MG.over = true;
  const d = MG.done, s = stars || (MG.mistakes===0 ? 3 : MG.mistakes===1 ? 2 : 1);
  const res = {win, stars:s, msg};

function startWhack(cfg, done){

  st.innerHTML = `<div class="mrule">Тапай по задачам — делегируй! 🔥 = две задачи, ☕ = +3 секунды. <b>Начальника не трогай</b>: нельзя делегировать начальнику.</div><div class="cubes" id="cubes">${Array.from({length:9},()=>'<div class="cube"><div class="pop"></div></div>').join('')}</div>`;

  prog();

    if(!MG || MG.over) return;
    const free = pops.filter(p=>!p.classList.contains('up')); if(!free.length) return;
    const p = pick(free), r = Math.random();
    const kind = r < cfg.bossP ? 'boss' : r < cfg.bossP + .1 ? 'fire' : r < cfg.bossP + .16 ? 'cof' : 'task';
    p.kind = kind; p.classList.remove('hit');

    p.classList.add('up');
    const life = (kind==='fire' ? .7 : 1) * cfg.life * 1000 * R(.8,1.2);
    clearTimeout(p.tm); p.tm = setTimeout(()=>p.classList.remove('up'), life);
  };
  pops.forEach(p=>p.addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(!MG || MG.over || !p.classList.contains('up') || p.classList.contains('hit')) return;
    p.classList.add('hit'); clearTimeout(p.tm); setTimeout(()=>p.classList.remove('up','hit'), 300);
    if(p.kind==='boss'){ mgMistake('Ты делегировал задачу начальнику 😬'); return; }
    if(p.kind==='cof'){ left += 3; sfx.heal(); toast('☕ +3 секунды'); prog(); return; }
    got += p.kind==='fire' ? 2 : 1; sfx.coin(p.kind==='fire'?5:0); prog();
    if(got >= n) mgEnd(true, `Все задачи делегированы! ${pick(WIN_LINES)}`, MG.mistakes===0 && left > cfg.time*.3 ? 3 : MG.mistakes<=1 ? 2 : 1);
  }));
  let acc = 0;
  MG.timers.push(setInterval(()=>{
    if(!MG || MG.over) return;
    left -= .1; acc += .1;
    const el = (cfg.time - left)/cfg.time, every = cfg.every * (1 - el*.45);
    if(acc >= every){ acc = 0; spawn(); if(Math.random()<.35) spawn(); }
    if(Math.abs(left - Math.round(left))<.05) prog();
    if(left<=0) mgEnd(false, 'Время вышло. Задачи остались у тебя 😵');
  }, 100));
  spawn();
}

  const log = t=>{ $('dlog').textContent = t; };
  const hitNeed = ()=> coffeeOn ? 3 : 4;
  log(G.intro);
  $('dCof').onclick = ()=>{ if(phase!=='ready'||!coffee) return; coffee=0; coffeeOn=true; sfx.heal(); log('☕ Кофе-брейк! В этот ход твой отряд попадает на 3+.'); draw(); };
  $('dRoll').onclick = ()=>{
    if(phase!=='ready') return;
    dice = me.filter(u=>u.alive).map(d6); phase='rolled'; sfx.tick(); sfx.blip();
    showDice(dice, hitNeed()); log(`Попадания на ${hitNeed()}+. Успехов: ${dice.filter(v=>v>=hitNeed()).length}.`); draw();
  };
  $('dRe').onclick = ()=>{ if(phase!=='rolled'||!reroll) return; reroll=0; dice = dice.map(v=>v===1?d6():v); sfx.blip(); showDice(dice, hitNeed()); log(`Протокол переброса применён. Успехов: ${dice.filter(v=>v>=hitNeed()).length}.`); draw(); };
  $('dAtk').onclick = ()=>{
    if(phase!=='rolled') return; phase='resolve'; draw();
    const hits = dice.filter(v=>v>=hitNeed()).length; coffeeOn = false;
    const saves = Array.from({length:hits}, d6), wounds = saves.filter(v=>v<E.save).length;
    showDice(saves, E.save);
    let killed = 0;
    for(let w=0; w<wounds; w++){ const t = en.find(u=>u.alive); if(!t) break; t.hp--; if(t.hp<=0){ t.alive=false; killed++; } }
    sfx.hit();
    log(`${hits} попаданий. Враг спасается на ${E.save}+ и проваливает ${wounds}. ${E.hp ? 'Аудитор теряет '+wounds+' ❤' : 'Повержено: '+killed}.`);
    draw();
    if(!en.some(u=>u.alive)){ MG.timers.push(setTimeout(()=>{ const alive = me.filter(u=>u.alive).length; mgEnd(true, G.win, alive>=4?3:alive>=2?2:1); }, 1200)); return; }
    MG.timers.push(setTimeout(enemyTurn, 1500));
  };
  const enemyTurn = ()=>{
    if(!MG) return;
    const atk = E.hp ? (E.atk||4) : en.filter(u=>u.alive).length;
    const rolls = Array.from({length:atk}, d6), hits = rolls.filter(v=>v>=E.hitOn).length;
    showDice(rolls, E.hitOn);
    log(`Ход врага: попадания на ${E.hitOn}+. Успехов: ${hits}. Твой отряд спасается силовыми пиджаками на 4+…`);
    MG.timers.push(setTimeout(()=>{
      if(!MG) return;
      const sv = Array.from({length:hits}, d6), lost = sv.filter(v=>v<4).length;
      showDice(sv, 4);
      for(let i=0;i<lost;i++){ const t = me.find(u=>u.alive); if(t) t.alive=false; }
      if(lost) sfx.hurt(); else sfx.coin();
      log(lost ? `Потеряно ветеранов: ${lost}. Они ушли в отпуск. Навсегда.` : 'Все пиджаки выдержали! Ни одной потери.');
      phase = 'ready'; draw();
      if(!me.some(u=>u.alive)) mgEnd(false, 'Отряд пал. Но квартальный отчёт помнит героев.');
    }, 1400));
  };
  draw();
}

const sndBtn=$('sndBtn'), musBtn=$('musBtn');
function togRender(){ sndBtn.classList.toggle('off', muted); musBtn.classList.toggle('off', !musicOn); }
togRender();
sndBtn.onclick = e=>{ e.stopPropagation(); muted=!muted; try{localStorage.setItem('dino_muted',muted?'1':'0');}catch(_){} togRender(); if(!muted) sfx.blip(); };
musBtn.onclick = e=>{ e.stopPropagation(); musicOn=!musicOn; try{localStorage.setItem('dino_music',musicOn?'1':'0');}catch(_){} togRender(); if(musicOn){ const c=ac(); if(c){ if(!SONG) playSong(songKey||'map-theme','major'); sNext=c.currentTime+.05; ensureTimer(); } } };
['pointerdown','keydown'].forEach(ev=>addEventListener(ev, ()=>{ const c=ac(); if(c && musicOn && SONG) ensureTimer(); }, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); });
$('bStory').onclick = ()=>{ sfx.blip(); storyMenu(); };
$('bPedia').onclick = ()=>{ sfx.blip(); pedia(); };
$('bTasks').onclick = ()=>{ sfx.blip(); tasksList(); };
$('bPrizes').onclick = ()=>{ sfx.blip(); prizesList(); };
$('bDaily').onclick = ()=>{ sfx.blip(); startDaily(); };
$('modal').addEventListener('click', e=>{ if(e.target===$('modal') && !document.getElementById('mGo') && !document.getElementById('tSend') && !document.getElementById('mRe')) closeModal(); });
goMap();
if(!S.seenIntro){
  S.seenIntro = true; save();
  modal(`<div class="pic">${DINOS.trex("#C3EBD3","#7FD3A2")}</div><h2>Добро пожаловать в «Юрский офис»!</h2><p>Ты — новый сотрудник-динозавр. Впереди 5 глав карьеры: опенспейс, удалёнка, овертайм, горящий проект и совет директоров. От твоих ответов в истории зависит, чем всё закончится.</p><p>Ищи коллег, бегай на планёрки, побеждай Понедельник, Созвон и Дедлайн — и собирай грамоты 🏅</p><p class="sub">включи звук 🔊 — у каждого уровня своя 8-битная песенка</p><div class="row"><button class="btn big" id="mOk" style="--c:var(--mint)">Выйти на работу 🦖</button></div>`, ()=>{ $('mOk').onclick=()=>{ ac(); playSong('map-theme','major'); closeModal(); }; });
}


})();
